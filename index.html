ng danh sách tham số"}, {"key": "B", "text": "Chỉ khác nhau kiểu trả về"}, {"key": "C", "text": "Cùng tên nhưng khác danh sách tham số (số lượng hoặc kiểu)"}, {"key": "D", "text": "Khác tên nhau hoàn toàn"}], "answer": "C", "explain": "Đáp án đúng: C. Đọc lại câu hỏi và đối chiếu khái niệm trong giáo trình."}, {"n": 98, "q": "Hai phương thức void F(int a) và int F(int a) trong cùng một lớp:", "opts": [{"key": "A", "text": "Không hợp lệ vì chỉ khác kiểu trả về"}, {"key": "B", "text": "Hợp lệ vì là nạp chồng"}, {"key": "C", "text": "Hợp lệ nếu cùng là public"}, {"key": "D", "text": "Hợp lệ nếu một cái là static"}], "answer": "A", "explain": "Đáp án đúng: A. Đọc lại câu hỏi và đối chiếu khái niệm trong giáo trình."}, {"n": 99, "q": "Đối với bộ khởi dựng, C# cho phép:", "opts": [{"key": "A", "text": "Không được nạp chồng"}, {"key": "B", "text": "Chỉ được có tối đa một bộ khởi dựng"}, {"key": "C", "text": "Chỉ khai báo bộ khởi dựng static"}, {"key": "D", "text": "Có nhiều bộ khởi dựng với danh sách tham số khác nhau"}], "answer": "D", "explain": "Đáp án đúng: D. Đọc lại câu hỏi và đối chiếu khái niệm trong giáo trình."}, {"n": 100, "q": "Danh sách tham số của hai phương thức được xem là khác nhau bởi:", "opts": [{"key": "A", "text": "Tên của các tham số"}, {"key": "B", "text": "Số lượng hoặc kiểu dữ liệu của các tham số"}, {"key": "C", "text": "Kiểu trả về"}, {"key": "D", "text": "Bổ sung truy cập"}], "answer": "B", "explain": "Đáp án đúng: B. Đọc lại câu hỏi và đối chiếu khái niệm trong giáo trình."}];
let idx=0, chosen={}, correctCount=0;
const $=id=>document.getElementById(id);
function render(){
 const item=data[idx], picked=chosen[idx];
 $('progress').textContent=`Câu ${idx+1} / ${data.length}`;
 $('score').textContent=`Đúng: ${correctCount}`;
 $('fill').style.width=((idx+1)/data.length*100)+'%';
 $('q').textContent=`Câu ${item.n}. ${item.q}`;
 $('opts').innerHTML=''; $('feedback').innerHTML='';
 $('answered').textContent=picked?'Đã trả lời':'Chưa trả lời';
 item.opts.forEach(o=>{
  const b=document.createElement('button'); b.className='opt';
  b.textContent=o.key+'. '+o.text;
  if(picked){b.disabled=true;if(o.key===item.answer)b.classList.add('correct');if(o.key===picked&&picked!==item.answer)b.classList.add('wrong')}
  b.onclick=()=>select(o.key); $('opts').appendChild(b);
 });
 if(picked){
  const ok=picked===item.answer;
  $('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Chính xác!':'✗ Chưa đúng.'}</b> Đáp án đúng là <b>${item.answer}</b>.</div>`;
 }
 $('prev').disabled=idx===0;
 $('next').disabled=!picked;
 $('next').textContent=idx===data.length-1?'Xem kết quả':'Câu tiếp theo →';
}
function select(k){
 if(chosen[idx])return;
 chosen[idx]=k;
 if(k===data[idx].answer)correctCount++;
 render();
}
$('prev').onclick=()=>{if(idx>0){idx--;render()}};
$('next').onclick=()=>{if(idx<data.length-1){idx++;render()}else finish()};
function finish(){
 $('quiz').classList.add('hide');$('result').classList.remove('hide');
 $('finalScore').textContent=`${correctCount} / ${data.length}`;
 $('summary').textContent=`Bạn đã trả lời ${Object.keys(chosen).length} câu. Tỷ lệ đúng: ${Math.round(correctCount/data.length*100)}%.`;
}
function restart(){idx=0;chosen={};correctCount=0;$('result').classList.add('hide');$('quiz').classList.remove('hide');render()}
render();
</script></body></html>
